<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!--
        다크/라이트 모드 정하기. <head> 안, main.css 보다 먼저 넣는다.
        페이지가 그려지기 전에 정해야 화면이 한 번 번쩍이지 않는다.
          1) 전에 버튼으로 고른 게 있으면 그것 (브라우저 localStorage 'pubgg.theme')
          2) 없으면 기기 설정(윈도우·폰의 라이트/다크)
        사용법: <script th:replace="~{fragments/theme :: init}"></script>
    -->
    <script th:fragment="init">
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('pubgg.theme'); } catch (e) {}
            var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (light ? 'light' : 'dark');
        })();
    </script>
</head>
<body>

<!--
    전환 버튼 (해 = 라이트로 바꾸기, 달 = 다크로 바꾸기). 누르면 static/js/theme.js 가 처리.
    사용법: <button th:replace="~{fragments/theme :: toggle('')}"></button>
-->
<button class="theme-toggle" type="button" data-theme-toggle aria-label="라이트 모드로 바꾸기"
        th:fragment="toggle(extraClass)" th:classappend="${extraClass}">
    <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
</button>

</body>
</html>
