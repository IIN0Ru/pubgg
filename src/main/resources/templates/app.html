<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
        모든 화면의 껍데기. 화면은 React(frontend/)가 #root 안에 그린다.
        서버는 탭 제목과 링크 미리보기(디스코드·카톡)용 <head> 만 채운다 — 크롤러는 JS 를 실행하지 않아서.
        값은 컨트롤러가 Shell.fill 로 넣는다. /search·/s/{id} 문구는 PlayerMatches.shareTitle / shareDescription
    -->
    <title th:text="${pageTitle}">펍지지 PUB.GG</title>
    <meta name="description" th:content="${pageDescription}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="펍지지 PUB.GG">
    <meta property="og:title" th:content="${ogTitle}">
    <meta property="og:description" th:content="${ogDescription}">
    <!-- 공유 주소(/s/{id})로 들어왔고 공유한 카드 그림이 남아 있으면 그 그림을 크게 (CardController /s/{id}/image) -->
    <meta property="og:image" th:if="${cardImageUrl != null}" th:content="${cardImageUrl}">
    <meta property="og:image:width" th:if="${cardImageUrl != null}" content="720">
    <meta property="og:image:height" th:if="${cardImageUrl != null}" content="960">
    <meta name="twitter:card" th:content="${cardImageUrl != null} ? 'summary_large_image' : 'summary'" content="summary">
    <!-- 디스코드는 이 색을 미리보기 카드 왼쪽 띠 색으로 쓴다 -->
    <meta name="theme-color" content="#FFD02F">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <!--
        다크/라이트 모드 정하기. main.css 보다 먼저, 화면을 그리기 전에 정해야 한 번 번쩍이지 않는다 (그래서 React 가 아니라 여기).
          1) 전에 버튼으로 고른 게 있으면 그것 (localStorage 'pubgg.theme', 전환 버튼은 React ThemeToggle)
          2) 없으면 기기 설정(윈도우·폰의 라이트/다크)
    -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('pubgg.theme'); } catch (e) {}
            var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (light ? 'light' : 'dark');
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<!--
    React 가 이 안을 그린다 (상단 바 · 화면 · 푸터). 빌드 결과는 Docker 빌드가 static/app/assets/ 에 넣는다.
    data-platform/data-nickname: 공유 주소 /s/{id} 가 보여줄 플레이어 (주소에 닉네임이 없어서). 다른 화면은 주소에서 읽는다
-->
<div id="root" th:attr="data-platform=${platform != null} ? ${platform.shard} : null,data-nickname=${nickname}"></div>

<noscript><p style="text-align:center;padding:48px 16px">펍지지는 자바스크립트를 켜야 볼 수 있어요.</p></noscript>

<script type="module" src="/app/assets/app.js" th:src="@{/app/assets/app.js}"></script>
</body>
</html>
