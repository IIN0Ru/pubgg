spring.application.name=pubgg

# 개발 중에는 템플릿을 캐시하지 않아서, HTML을 고치고 새로고침하면 바로 반영된다.
spring.thymeleaf.cache=false

server.port=8080

# PUBG API
# 키는 환경 변수 PUBG_API_KEY 에서 읽는다. 코드나 이 파일에 키를 직접 쓰지 않는다.
pubg.api.key=${PUBG_API_KEY:}
pubg.api.base-url=https://api.pubg.com
pubg.api.recent-match-limit=10

# 리플레이 데이터(JSON)가 수백 KB 라서 압축해서 보낸다 (보통 1/5 정도로 줄어듦)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=2048

# 사이트에 저장한 플레이어 카드 (꾸민 값 JSON + 미리보기 PNG)
#   jdbc(기본): PostgreSQL 에 저장 (JdbcCardStore, 표는 schema.sql)
#   file      : 서버 폴더에 파일로 저장 (FileCardStore). 이 모드에서는 DB 가 없어도 되게 SQL_INIT_MODE=never 도 같이 준다
pubgg.card-store=${CARD_STORE:jdbc}
pubgg.card-dir=./data/cards

# DB (PostgreSQL). 값을 안 주면 로컬 docker compose 의 db 에 붙는다.
# 배포할 때는 환경 변수 DB_URL, DB_USER, DB_PASSWORD 로 덮어쓴다 (비밀번호를 이 파일에 쓰지 않는다)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pubgg}
spring.datasource.username=${DB_USER:pubgg}
spring.datasource.password=${DB_PASSWORD:pubgg}
spring.sql.init.mode=${SQL_INIT_MODE:always}
