spring.application.name=pubgg

# 개발 중에는 템플릿을 캐시하지 않아서, HTML을 고치고 새로고침하면 바로 반영된다.
spring.thymeleaf.cache=false

server.port=8080

# PUBG API
# 키는 환경 변수 PUBG_API_KEY 에서 읽는다. 코드나 이 파일에 키를 직접 쓰지 않는다.
pubg.api.key=${PUBG_API_KEY:}
pubg.api.base-url=https://api.pubg.com
pubg.api.recent-match-limit=10

# 리플레이 데이터(JSON)가 수백 KB 라서 압축해서 보낸다 (보통 1/5 정도로 줄어듦)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=2048

# 사이트에 저장한 플레이어 카드 (꾸민 값 JSON + 미리보기 PNG).
# 이 폴더 저장은 로컬 개발용이다. 운영(prod 프로필)에서는 DB 에 저장한다 (application-prod.properties 참고)
pubgg.card-dir=./data/cards

# 기본(로컬) 실행에는 DB 가 없으므로 DB 자동 연결을 끈다. 이걸 안 끄면 DB 주소가 없다고 서버가 켜지지 않는다.
# 운영(prod 프로필)에서는 application-prod.properties 가 이 설정을 비워서 다시 켠다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
