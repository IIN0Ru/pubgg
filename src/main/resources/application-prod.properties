# 운영(prod 프로필) 설정. 서버를 켤 때 환경 변수 SPRING_PROFILES_ACTIVE=prod 로 지정한다.
# 여기 적은 값이 application.properties 의 같은 설정보다 우선한다.

# 호스팅이 정해준 포트(환경 변수 PORT)로 연다. 없으면 8080
server.port=${PORT:8080}

# 개발 중에만 껐던 템플릿 캐시를 운영에서는 켠다
spring.thymeleaf.cache=true

# 호스팅의 프록시(HTTPS 를 풀어주는 서버) 뒤에서 돈다. 프록시가 알려주는 원래 주소·https 여부를 따른다.
# 안 하면 링크 미리보기(og:image) 주소가 http 로 만들어진다 (HomeController 가 요청 주소로 만든다)
server.forward-headers-strategy=framework

# application.properties 에서 꺼둔 DB 자동 연결을 다시 켠다 (빈 값 = 제외할 것 없음)
spring.autoconfigure.exclude=

# DB (PostgreSQL). 값은 전부 환경 변수로 받는다. 코드와 GitHub 에 주소·비밀번호를 쓰지 않는다.
# 환경 변수가 없으면 서버가 켜질 때 "Could not resolve placeholder" 오류로 바로 멈춘다 (빠르게 실패하는 게 낫다)
# DB_URL 형식: jdbc:postgresql://호스트:5432/DB이름   (호스팅이 주는 postgres://... 주소를 그대로 넣으면 안 된다)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 무료 DB 는 동시에 연결할 수 있는 수가 적다. 연결 풀을 작게 둔다
spring.datasource.hikari.maximum-pool-size=5

# 서버가 켜질 때 카드 테이블을 만든다 (이미 있으면 그대로 둔다)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
