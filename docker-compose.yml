# 로컬 실행용: DB 만 띄우거나(평소 개발), 앱까지 컨테이너로 띄운다(배포 전 점검).
#
#   평소 개발   docker compose up -d db      → 앱은 IntelliJ 에서 실행 (기본 접속 값이 이 db 에 맞춰져 있다)
#   배포 전 점검  docker compose up --build    → 앱도 컨테이너로 (메모리 1GB 제한)
#   끄기        docker compose down          (데이터는 남는다.  데이터까지 지우려면 down -v)
#
# 비밀번호·API 키는 이 파일에 쓰지 않는다. 같은 폴더의 .env 파일에서 읽는다 (.env.example 참고).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pubgg
      POSTGRES_USER: pubgg
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pubgg}
    ports:
      - "127.0.0.1:5432:5432"   # 내 컴퓨터에서만 접속 가능
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubgg -d pubgg"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBG_API_KEY: ${PUBG_API_KEY:-}
      DB_URL: jdbc:postgresql://db:5432/pubgg   # 컨테이너 안에서는 localhost 가 아니라 서비스 이름 db
      DB_USER: pubgg
      DB_PASSWORD: ${DB_PASSWORD:-pubgg}
    ports:
      - "8080:8080"
    mem_limit: 1g   # 작은 서버(1GB)에서도 도는지 미리 확인

volumes:
  pgdata:
