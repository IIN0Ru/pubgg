# 커밋·PR 마다 테스트를 돌린다 (Java 21 + Maven).
# PUBG API 키는 필요 없다: 테스트는 src/test/resources 의 예시 텔레메트리와 가짜 서비스(Mockito)만 쓴다.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 테스트
        run: mvn -B -ntp test

      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  # React 프론트엔드(frontend/): 타입 검사 + 테스트 + 빌드
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
      - name: 빌드
        run: npm run build
